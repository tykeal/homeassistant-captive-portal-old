<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ portal_title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: {{ background_color }};
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .portal-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo img {
            max-width: 150px;
            height: auto;
        }

        h1 {
            color: {{ primary_color }};
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: {{ primary_color }};
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: {{ primary_color }};
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background-color: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .success-message {
            background-color: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid {{ primary_color }};
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }

        {% if custom_css %}
        /* Custom CSS from theme */
        {{ custom_css | safe }}
        {% endif %}
    </style>
</head>
<body>
    <div class="portal-container">
        {% if logo_url %}
        <div class="logo">
            <img src="{{ logo_url }}" alt="{{ portal_title }}" onerror="this.style.display='none'">
        </div>
        {% endif %}

        <h1>{{ portal_title }}</h1>
        <p class="subtitle">Enter your voucher code to access the network</p>

        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>

        <form id="auth-form">
            <div class="form-group">
                <label for="voucher_code">Voucher Code</label>
                <input
                    type="text"
                    id="voucher_code"
                    name="voucher_code"
                    placeholder="Enter your code"
                    required
                    autocomplete="off"
                >
            </div>

            <button type="submit" id="submit-btn">Connect to Network</button>

            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <p style="margin-top: 10px; color: #666;">Authenticating...</p>
            </div>
        </form>

        <div class="footer">
            <p>Need help? Contact the property manager</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('auth-form');
        const submitBtn = document.getElementById('submit-btn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Clear previous messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            // Get form data
            const voucherCode = document.getElementById('voucher_code').value.trim();

            if (!voucherCode) {
                showError('Please enter a voucher code');
                return;
            }

            // Disable form and show loading
            submitBtn.disabled = true;
            loading.style.display = 'block';

            try {
                const response = await fetch('/portal/authenticate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        voucher_code: voucherCode,
                        device_mac: null  // TODO: Can be extracted from request in backend
                    })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    // Success! Show success message and redirect
                    showSuccess('Access granted! Redirecting...');
                    setTimeout(() => {
                        window.location.href = '/portal/success';
                    }, 1500);
                } else {
                    // Authentication failed
                    const message = data.detail?.message || data.message || 'Authentication failed';
                    showError(message);
                    submitBtn.disabled = false;
                    loading.style.display = 'none';
                }
            } catch (error) {
                console.error('Authentication error:', error);
                showError('Network error. Please try again.');
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
        }
    </script>
</body>
</html>
